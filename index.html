<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus Club</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-card {
            background: #1c1c1e;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #ffaa00;
        }
        h2 {
            margin: 10px 0 5px 0;
            font-size: 22px;
        }
        .nickname {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .info-block {
            text-align: left;
            background: #2c2c2e;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
        .info-block span {
            color: #ffaa00;
            font-weight: bold;
        }
        .contacts {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: block;
            background: #ffaa00;
            color: #000;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-vb { background: #7360F2; color: #fff; }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Ссылка на фотографию анкеты -->
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Фото" class="profile-img">
        
        <h2>Анна, 26</h2>
        <div class="nickname">@anna_private</div>

        <div class="info-block">
            <p><strong>Возраст:</strong> 26 лет</p>
            <p><strong>Пожелания:</strong> Ищу интересного собеседника для совместных походов на мероприятия и приятного общения в Пхукете.</p>
        </div>

        <div class="contacts">
            <!-- Ссылки на мессенджеры -->
            <a href="https://t.me/username" class="btn">Написать в Telegram</a>
            <a href="https://wa.me/66000000000" class="btn btn-wa">Написать в WhatsApp</a>
            <a href="viber://chat?number=%2B66000000000" class="btn btn-vb">Написать в Viber</a>
        </div>
    </div>

</body>
</html>
